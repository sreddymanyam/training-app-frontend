<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
<head th:insert ="fragments/links"/>
	<title>Login page</title>
</head>
 <body>
	
	<div  class="header" th:replace="fragments/header :: header">
		...
	</div>

	<div style="text-align: right;padding: 10px;">
		<a class="btn btn-warning " th:href="@{/home.htm}" > Back To Home Page</a>
	</div>

	<div class = "body container">
		
		<div class="page Header" style="text-align: center; color:blueviolet;">
			<h1 style="padding: 10px;" >Welcome to Easy Learn </h1>
		</div>
		
		<div class="row d-flex justify-content-center align-items-center h-100">
			
			<div class="col-md-9 col-lg-6 col-xl-5">
		    	<img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
		        class="img-fluid" alt="Sample image">
			</div>
			  
		    <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
		    	<form action="#" th:action="@{/home.htm}" >
					<label class="form-label" for="form3Example3">Email address :</label>
			        <div data-mdb-input-init class="form-outline mb-4">
			        	<input type="text" id="form3Example3" class="form-control form-control-lg"
			            placeholder="Enter a valid email address" required />
			        </div>
		
					<label class="form-label" for="form3Example4">Password:</label>
			        <div data-mdb-input-init class="form-outline mb-3">
			        	<input type="password" id="form3Example4" class="form-control form-control-lg"placeholder="Enter password"
						required/>
					</div>
		
					<div class="d-flex justify-content-between align-items-center">
						<div class="form-check mb-0">
						   	<input class="form-check-input me-2" type="checkbox" value="" id="form2Example3" />
			            	<label class="form-check-label" for="form2Example3">Remember me</label>
			            </div>
						<a th:href="@{'/home.htm'}" class="text-body">Forgot password?</a>
					</div>
						
			        <div class="text-center text-lg-start mt-4 pt-2">
						<button  type="submit" value="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary "
			   				style="padding-left: 2.5rem; padding-right: 2.5rem;">Login
						</button>
			            <p class="small fw-bold mt-2 pt-1 mb-0">Don't have an account? <a th:href="@{'/home.htm'}" 
			            	class="link-danger">Register</a>
						</p>
					</div>
				</form>
			</div>
		</div>
	</div>
	
</body>
</html>
